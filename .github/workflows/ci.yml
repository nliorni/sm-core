name: CI

on:
  push:
  pull_request:

jobs:
  tutorial-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # run.py uses the snakemake.snakemake(...) Python API, removed in
        # Snakemake 8+ -- see README.md's Requirements section.
        run: pip install "snakemake<8" colorama pyyaml

      - name: Dry-run the tutorial
        run: ./run.py -w example -c tests/tutorial/config_tutorial.yaml -q 2 -n --no-conda

      - name: Run the tutorial
        run: ./run.py -w example -c tests/tutorial/config_tutorial.yaml -q 2 --no-conda

      - name: Check output
        run: |
          test -f tests/tutorial/output/summary.tsv
          diff <(sort tests/tutorial/output/summary.tsv) <(sort <<'EOF'
          sample	r1_lines	r2_lines
          SAMPLE_A	4	4
          SAMPLE_B	2	2
          EOF
          )
