# MultiQC configuration for sm-core/atacseq reports (rule multiqc).
report_comment: >
  Generated by sm-core/atacseq. The ATAC-seq QC table compares every sample
  with the ENCODE ATAC-seq standards; results/qc/atac_qc_summary.tsv holds the
  same numbers.

# Sample names come from file names such as SAMPLE.fastp.json and
# SAMPLE.markdup.metrics, and from BAM paths; strip the suffixes so every
# module agrees.
extra_fn_clean_exts:
  - ".fastp"
  - ".markdup"
  - ".filtered"
  - ".flagstat"
  - ".idxstats"
  - ".stats"
  - ".bam"
  - "_peaks"

module_order:
  - fastp
  - bowtie2
  - picard
  - samtools
  - macs2
  - featurecounts
  - somalier

custom_content:
  order:
    - atac_qc
    - atac_fragment_sizes
    - atac_tss_enrichment
