# MultiQC configuration for sm-core/rnaseq reports (rule multiqc).
report_comment: >
  Generated by sm-core/rnaseq. One report per quantification branch; the
  other branch has its own report next to this one's directory.

# Sample names come from file names such as SAMPLE.fastp.json and
# SAMPLE.Log.final.out; strip the tool suffixes so every module agrees.
extra_fn_clean_exts:
  - ".fastp"
  - ".Log.final.out"
  - ".ReadsPerGene.out.tab"
  - ".metrics.tsv"

module_order:
  - fastp
  - star
  - rna_seqc
  - salmon

# Custom-content tables (strandedness, count composition) after the tools.
custom_content:
  order:
    - strandedness_star
    - strandedness_salmon
    - biotypes_star
    - biotypes_salmon
