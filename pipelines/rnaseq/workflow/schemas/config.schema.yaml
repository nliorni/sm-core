$schema: "https://json-schema.org/draft/2020-12/schema"
description: >-
  sm-core/rnaseq project configuration. Validated at parse time; every
  `default` here is filled in when the key is absent, so config/config.yaml
  only has to state what differs. The annotated template is
  config/config.yaml.
type: object

properties:
  output_dir:
    type: string
    description: Main output directory.

  samplesheet:
    type: string
    description: nf-core-style CSV/TSV with sample,fastq_1,fastq_2[,strandedness,...].
  samples:
    type: object
    description: SAMPLE_ID -> FASTQ prefix, or list of prefixes (lanes/runs merged).
  unit:
    type: array
    items: {type: string}
    minItems: 2
    maxItems: 2
  extension:
    type: string

  strandedness:
    type: string
    enum: [auto, unstranded, forward, reverse]
    default: auto
    description: Default library strandedness; a samplesheet column overrides it per sample.

  notify_email:
    type: string
  conda_envs:
    type: object
    additionalProperties: {type: string}

  reference:
    type: object
    properties:
      genome:
        type: string
        description: Genome FASTA, plain or gzipped.
      gtf:
        type: string
        description: Gene annotation GTF matching the genome, plain or gzipped.
      spikein_fasta:
        type: [string, "null"]
        default: null
      dir:
        type: [string, "null"]
        default: null
      star_index:
        type: [string, "null"]
        default: null
      salmon_index:
        type: [string, "null"]
        default: null
      star_sjdb_overhang:
        type: integer
        minimum: 1
        default: 100
      salmon_kmer:
        type: integer
        minimum: 15
        maximum: 31
        default: 31
      threads:
        type: integer
        minimum: 1
        default: 16
      star_index_mem_mb:
        type: integer
        default: 48000
      salmon_index_mem_mb:
        type: integer
        default: 32000
    required: [genome, gtf]

  trimming:
    type: object
    default: {}
    properties:
      enabled:
        type: boolean
        default: true
      min_length:
        type: integer
        minimum: 1
        default: 20
      extra:
        type: string
        default: ""
      threads:
        type: integer
        minimum: 1
        default: 8
      mem_mb:
        type: integer
        default: 4000

  star:
    type: object
    default: {}
    properties:
      threads:
        type: integer
        minimum: 1
        default: 16
      mem_mb:
        type: integer
        default: 40000
      two_pass:
        type: boolean
        default: true
      sort_threads:
        type: integer
        minimum: 1
        default: 4
      sort_mem_per_thread:
        type: string
        default: "1G"
      extra:
        type: string
        default: ""

  salmon:
    type: object
    default: {}
    properties:
      threads:
        type: integer
        minimum: 1
        default: 8
      mem_mb:
        type: integer
        default: 32000
      extra:
        type: string
        default: "--gcBias --seqBias"

  qc:
    type: object
    default: {}
    properties:
      stranded_threshold:
        type: number
        minimum: 0.5
        maximum: 1
        default: 0.8
      unstranded_threshold:
        type: number
        minimum: 0
        maximum: 0.5
        default: 0.1
      fail_on_strandedness_mismatch:
        type: boolean
        default: false
      rnaseqc:
        type: boolean
        default: true
      rnaseqc_extra:
        type: string
        default: ""
      multiqc_extra:
        type: string
        default: ""

  de:
    type: object
    default: {}
    description: >-
      Differential expression with PyDESeq2, then ORA and GSEA, for every
      analysis x split x contrast below. Runs with -w de, and with -w all
      when `analyses` is not empty.
    properties:
      matrices:
        type: array
        items: {type: string, enum: [salmon, star]}
        minItems: 1
        default: [salmon]
        description: >-
          Which count matrices to test. salmon uses tximport's length-scaled
          counts (rounded), star STAR's integer counts.
      alpha:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        default: 0.05
        description: Adjusted p-value cut-off, for independent filtering and the significant lists.
      min_abs_log2fc:
        type: number
        minimum: 0
        default: 1.0
        description: Minimum |log2 fold change| for a gene to enter the significant lists (and ORA).
      min_count:
        type: integer
        minimum: 0
        default: 10
        description: >-
          Pre-filter: keep a gene with at least this many reads in at least as
          many samples as the smallest group of the contrast's factor.
      shrink:
        type: boolean
        default: true
        description: Add apeGLM-style shrunken log2 fold changes (PyDESeq2 lfc_shrink), used for plots.
      label_top:
        type: integer
        minimum: 0
        default: 15
        description: Gene names written on the volcano plot (most significant first).
      heatmap_top:
        type: integer
        minimum: 2
        default: 50
      plot_formats:
        type: array
        items: {type: string, enum: [png, pdf, svg]}
        minItems: 1
        default: [png, pdf]
      threads:
        type: integer
        minimum: 1
        default: 4
      mem_mb:
        type: integer
        default: 8000
      gene_sets:
        type: object
        default: {}
        properties:
          species:
            type: string
            enum: [human, mouse]
            default: human
          msigdb_version:
            type: string
            default: "2026.1"
          collections:
            type: array
            items: {type: string, enum: [hallmark, reactome, go_bp]}
            default: [hallmark, reactome, go_bp]
            description: MSigDB collections, downloaded once into <reference.dir>/gene_sets/.
          custom:
            type: object
            additionalProperties: {type: string}
            default: {}
            description: Extra gene-set collections, name -> .gmt file of gene symbols.
          min_size:
            type: integer
            minimum: 1
            default: 15
          max_size:
            type: integer
            minimum: 2
            default: 500
      gsea:
        type: object
        default: {}
        properties:
          permutations:
            type: integer
            minimum: 100
            default: 1000
          seed:
            type: integer
            default: 42
          rank_by:
            type: string
            enum: [stat, shrunken_log2fc]
            default: stat
          fdr:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            default: 0.25
            description: GSEA FDR cut-off for calling a gene set enriched (Subramanian et al. 2005).
      analyses:
        type: array
        default: []
        items:
          type: object
          required: [name, design, contrasts]
          additionalProperties: false
          properties:
            name:
              type: string
              pattern: "^[A-Za-z0-9_.-]+$"
            design:
              type: string
              pattern: "^\\s*~"
              description: PyDESeq2 design formula over samplesheet columns, e.g. "~ condition".
            split_by:
              type: [string, "null"]
              description: >-
                Samplesheet column: fit a separate model for each of its values
                (e.g. one per cell line). Omit to model all samples together.
            exclude:
              type: array
              items: {type: string}
              description: Sample names left out of this analysis.
            contrasts:
              type: array
              minItems: 1
              items:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: string}
                description: "[factor, test level, reference level]: log2 fold change = test / reference."

required: [output_dir, reference]
