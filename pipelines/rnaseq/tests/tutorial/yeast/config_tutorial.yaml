# ============================================================================
# sm-core/rnaseq: yeast smoke-test config (tests/tutorial/yeast)
# ============================================================================
# Runnable as is after ./download_tutorial_data.sh. Paths are relative to the
# pipeline directory (pipelines/rnaseq/), which run.py uses as the working
# directory wherever it is launched from; FASTQ paths in the samplesheet are
# relative to the samplesheet itself.
#
# Resources are cut down to fit a laptop: the genome is 230 kb.
# ============================================================================

output_dir: "tests/tutorial/yeast/output/"
samplesheet: "tests/tutorial/yeast/samplesheet.csv"

reference:
  genome: "tests/tutorial/yeast/reference/genome.fasta"
  gtf: "tests/tutorial/yeast/reference/genes.gtf"
  # No spike-ins in these reads: added to exercise the spike-in path.
  spikein_fasta: "tests/tutorial/yeast/reference/ERCC92.fa"
  threads: 2
  star_index_mem_mb: 4000
  salmon_index_mem_mb: 4000
  # 2x101 bp reads.
  star_sjdb_overhang: 100

trimming:
  threads: 2

star:
  threads: 2
  mem_mb: 4000

salmon:
  threads: 2
  mem_mb: 4000

# Differential expression (-w de, and part of -w all here): RAP1 depletion
# against wild type. Three samples only, so the point is to exercise the code
# end to end, not the biology. MSigDB is human/mouse, so this uses a small
# custom gene-set file instead.
de:
  matrices: [salmon, star]
  threads: 2
  mem_mb: 4000
  gene_sets:
    collections: []
    custom:
      yeast_test: tests/tutorial/yeast/gene_sets.gmt
    min_size: 5
  gsea:
    permutations: 100
  analyses:
    - name: rap1
      design: "~ condition"
      contrasts:
        - [condition, RAP1_IAA, WT]
