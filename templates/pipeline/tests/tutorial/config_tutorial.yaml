# Runnable smoke-test config for the toy demo pipeline (see README.md in
# this directory). Paths are relative to the pipeline directory, which
# run.py uses as the working directory.

output_dir: "tests/tutorial/output/"

unit: ["R1", "R2"]
extension: "txt"

samples:
  SAMPLE_A: "tests/tutorial/data/sample_A"
  SAMPLE_B: "tests/tutorial/data/sample_B"
