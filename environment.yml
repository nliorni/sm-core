name: sm-core
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal=9.16.0
  # Only needed for -cl/--cluster (generic shell-command cluster
  # submission, e.g. PBS qsub). See PIPELINE.md for what this plugin is.
  - snakemake-executor-plugin-cluster-generic=1.0.9
  - colorama
  - pyyaml
